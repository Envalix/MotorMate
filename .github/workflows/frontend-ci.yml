name: Frontend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - "motormate-frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "motormate-frontend/**"
      - ".github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: motormate-frontend

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: motormate-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Use staging API for develop branch builds, prod for main
          NEXT_PUBLIC_API_URL: ${{ github.ref == 'refs/heads/main' && secrets.NEXT_PUBLIC_API_URL_PROD || secrets.NEXT_PUBLIC_API_URL_STAGING }}

  # ─── Vercel deploys via GitHub integration automatically ─────────────────────
  # Vercel watches this repo and auto-deploys:
  #   develop → Preview deployment (staging)
  #   main    → Production deployment
  # No manual step needed here — CI job above acts as a required status check.
